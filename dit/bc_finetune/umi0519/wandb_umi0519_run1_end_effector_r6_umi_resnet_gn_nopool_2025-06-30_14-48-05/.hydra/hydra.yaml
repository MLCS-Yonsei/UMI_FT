hydra:
  run:
    dir: dit/bc_finetune/${exp_name}/wandb_${wandb.name}_${hydra:runtime.choices.task}_${hydra:runtime.choices.agent/features}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${base:}/../bc_finetune/${exp_name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: run${hydra:job.num}_${hydra:runtime.choices.task}_${hydra:runtime.choices.agent/features}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    timeout_min: 360
    cpus_per_task: ${num_workers}
    gpus_per_node: ${devices}
    tasks_per_node: ${devices}
    mem_gb: ${mult:${devices},124}
    nodes: 1
    name: ${hydra.job.name}
    stderr_to_stdout: false
    _target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
    partition: default
    qos: null
    comment: null
    constraint: null
    exclude: null
    gres: null
    cpus_per_gpu: null
    gpus_per_task: null
    mem_per_gpu: null
    mem_per_cpu: null
    account: null
    signal_delay_s: 120
    max_num_timeout: 100
    additional_parameters: {}
    array_parallelism: 256
    setup: null
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - exp_name=umi0519
    - agent=diffusion
    - task=end_effector_r6_umi
    - buffer_path=/home/soochul/GoPro_20250519_DiT/buf.pkl
    - normalizer_path=/home/soochul/GoPro_20250519_DiT/normalizer.pkl
    - agent.features.restore_path=/home/soochul/umi_act/UMI_FT/dit/visual_features/resnet18/IN_1M_resnet18.pth
    - max_iterations=500000
    - trainer=bc_cos_sched
    - ac_chunk=100
    - train_transform=medium
    - task.train_buffer.cam_indexes=[0,1]
    - wandb.entity=Soochul
    - wandb.project=dit_experiments
    - wandb.name=umi0519_run1
    - wandb.debug=False
  job:
    name: train
    chdir: null
    override_dirname: ac_chunk=100,agent.features.restore_path=/home/soochul/umi_act/UMI_FT/dit/visual_features/resnet18/IN_1M_resnet18.pth,agent=diffusion,buffer_path=/home/soochul/GoPro_20250519_DiT/buf.pkl,exp_name=umi0519,max_iterations=500000,normalizer_path=/home/soochul/GoPro_20250519_DiT/normalizer.pkl,task.train_buffer.cam_indexes=[0,1],task=end_effector_r6_umi,train_transform=medium,trainer=bc_cos_sched,wandb.debug=False,wandb.entity=Soochul,wandb.name=umi0519_run1,wandb.project=dit_experiments
    id: ???
    num: ???
    config_name: finetune.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/soochul/umi_act/UMI_FT
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/soochul/umi_act/UMI_FT/dit/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/soochul/umi_act/UMI_FT/dit/bc_finetune/umi0519/wandb_umi0519_run1_end_effector_r6_umi_resnet_gn_nopool_2025-06-30_14-48-05
    choices:
      workspace: train_dit_workspace
      workspace/task: umi_ft_depth
      trainer: bc_cos_sched
      task: end_effector_r6_umi
      agent: diffusion
      agent/features: resnet_gn_nopool
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: slurm
      hydra/output: default
  verbose: false
