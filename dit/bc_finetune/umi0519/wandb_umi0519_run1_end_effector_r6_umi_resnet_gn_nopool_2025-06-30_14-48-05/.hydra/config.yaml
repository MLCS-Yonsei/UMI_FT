agent:
  features:
    _target_: dit.models.resnet.ResNet
    size: 18
    weights: IMAGENET1K_V1
    restore_path: /home/soochul/umi_act/UMI_FT/dit/visual_features/resnet18/IN_1M_resnet18.pth
    avg_pool: false
    conv_repeat: ${mult:${agent.early_fusion},${agent.imgs_per_cam}}
    norm_cfg:
      name: group_norm
      num_groups: 16
  _target_: dit.policy.dit_policy.DiffusionTransformerPolicy
  odim: ${task.obs_dim}
  n_cams: ${task.n_cams}
  use_obs: add_token
  dropout: 0.1
  train_diffusion_steps: 100
  eval_diffusion_steps: 8
  ac_dim: ${task.ac_dim}
  ac_chunk: ${ac_chunk}
  imgs_per_cam: ${add:${img_chunk},${len:${task.train_buffer.goal_indexes}}}
  share_cam_features: false
  early_fusion: false
  feat_norm: null
  noise_net_kwargs:
    time_dim: 256
    hidden_dim: 512
    num_blocks: 6
    dim_feedforward: 2048
    dropout: ${agent.dropout}
    nhead: 8
    activation: gelu
task:
  _target_: dit.task.task.BCTask
  obs_dim: 16
  ac_dim: 10
  n_cams: ${len:${task.train_buffer.cam_indexes}}
  train_buffer:
    _target_: dit.common.replay_buffer.RobobufReplayBuffer
    buffer_path: ${buffer_path}
    normalizer_path: ${normalizer_path}
    transform: ${transform:${train_transform}}
    n_test_trans: 500
    ac_chunk: ${ac_chunk}
    mode: train
    cam_indexes:
    - 0
    - 1
    goal_indexes: []
    past_frames: ${add:${img_chunk},-1}
    ac_dim: ${task.ac_dim}
  test_buffer:
    _target_: dit.common.replay_buffer.RobobufReplayBuffer
    buffer_path: ${buffer_path}
    normalizer_path: ${normalizer_path}
    transform: ${transform:preproc}
    n_test_trans: 500
    ac_chunk: ${ac_chunk}
    mode: test
    cam_indexes: ${task.train_buffer.cam_indexes}
    goal_indexes: ${task.train_buffer.goal_indexes}
    past_frames: ${add:${img_chunk},-1}
    ac_dim: ${task.ac_dim}
trainer:
  _target_: dit.trainers.bc.BehaviorCloning
  optim_builder:
    _target_: dit.trainers.utils.optim_builder
    optimizer_type: AdamW
    optimizer_kwargs:
      lr: ${lr}
      betas:
      - 0.95
      - 0.999
      weight_decay: 1.0e-06
      eps: 1.0e-08
  schedule_builder:
    _target_: dit.trainers.utils.schedule_builder
    schedule_type: cosine
    from_diffusers: true
    schedule_kwargs:
      num_warmup_steps: 2000
      num_training_steps: ${max_iterations}
workspace:
  name: train_dit
  _target_: dit.workspace.train_dit_workspace.TrainDiTWorkspace
  task_name: ${task.name}
  shape_meta: ${task.shape_meta}
  exp_name: default
  n_action_steps: 8
  policy:
    _target_: act.policy.act_policy.ACTPolicy
    lr: 5.0e-05
    kl_weight: 10
    lr_backbone: 1.0e-05
    nheads: 8
    state_dim: ${state_dim}
    action_dim: ${action_dim}
    backbone: resnet18
    dilation: false
    position_embedding: sine
    camera_names: ${camera_names}
    encoder_layers: 4
    decoder_layers: 7
    dim_feedforward: 3200
    hidden_dim: 512
    drop_out: 0.1
    num_queries: ${chunk_size}
    pre_norm: true
    masks: false
    weight_decay: 0.0001
    lr_drop: 200
    clip_max_norm: 0.1
    is_joint: ${is_joint}
    is_depth: ${is_depth}
  dataloader:
    batch_size: 64
    num_workers: 4
    shuffle: true
    pin_memory: true
    persistent_workers: false
  val_dataloader:
    batch_size: 64
    num_workers: 4
    shuffle: true
    pin_memory: true
    persistent_workers: false
  optimizer:
    _target_: torch.optim.AdamW
    lr: 0.0001
    betas:
    - 0.95
    - 0.999
    eps: 1.0e-08
    weight_decay: 1.0e-06
  training:
    device: cuda:0
    seed: 42
    debug: false
    resume: false
    num_epochs: 36000
    batch_size: 64
    eval: false
    checkpoint_every: 6000
    tqdm_interval_sec: 1.0
  logging:
    project: act_debug
    resume: true
    mode: online
    name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
    tags:
    - ${name}
    - ${task_name}
    - ${exp_name}
    id: null
    group: null
  checkpoint:
    topk:
      monitor_key: train_loss
      mode: min
      k: 20
      format_str: epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt
    save_last_ckpt: true
    save_last_snapshot: false
  multi_run:
    run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  hydra:
    job:
      override_dirname: ${name}
    run:
      dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    sweep:
      dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
      subdir: ${hydra.job.num}
  task:
    name: umi
    camera_obs_latency: 0.125
    robot_obs_latency: 0.0001
    gripper_obs_latency: 0.02
    ft_sensor_obs_latency: 0.0001
    dataset_frequeny: 0
    obs_down_sample_steps: 3
    low_dim_obs_horizon: 2
    img_obs_horizon: 2
    action_horizon: 16
    ignore_proprioception: false
    shape_meta:
      obs:
        camera0_rgb:
          shape:
          - 3
          - 224
          - 224
          horizon: ${task.img_obs_horizon}
          latency_steps: 0
          down_sample_steps: ${task.obs_down_sample_steps}
          type: rgb
          ignore_by_policy: false
        camera0_depth:
          shape:
          - 3
          - 224
          - 224
          horizon: ${task.img_obs_horizon}
          latency_steps: 0
          down_sample_steps: ${task.obs_down_sample_steps}
          type: depth
          ignore_by_policy: false
        robot0_eef_pos:
          shape:
          - 3
          horizon: ${task.low_dim_obs_horizon}
          latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.robot_obs_latency})
            * ${task.dataset_frequeny}'}
          down_sample_steps: ${task.obs_down_sample_steps}
          type: low_dim
          ignore_by_policy: ${task.ignore_proprioception}
        robot0_eef_rot_axis_angle:
          raw_shape:
          - 3
          shape:
          - 6
          horizon: ${task.low_dim_obs_horizon}
          latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.robot_obs_latency})
            * ${task.dataset_frequeny}'}
          down_sample_steps: ${task.obs_down_sample_steps}
          type: low_dim
          rotation_rep: rotation_6d
          ignore_by_policy: ${task.ignore_proprioception}
        robot0_gripper_width:
          shape:
          - 1
          horizon: ${task.low_dim_obs_horizon}
          latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.gripper_obs_latency})
            * ${task.dataset_frequeny}'}
          down_sample_steps: ${task.obs_down_sample_steps}
          type: low_dim
          ignore_by_policy: ${task.ignore_proprioception}
        robot0_eef_rot_axis_angle_wrt_start:
          raw_shape:
          - 3
          shape:
          - 6
          horizon: ${task.low_dim_obs_horizon}
          latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.robot_obs_latency})
            * ${task.dataset_frequeny}'}
          down_sample_steps: ${task.obs_down_sample_steps}
          type: low_dim
          ignore_by_policy: ${task.ignore_proprioception}
        robot0_force:
          shape:
          - 3
          horizon: ${task.low_dim_obs_horizon}
          latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.ft_sensor_obs_latency})
            * ${task.dataset_frequeny}'}
          down_sample_steps: ${task.obs_down_sample_steps}
          type: low_dim
          ignore_by_policy: ${task.ignore_proprioception}
        robot0_torque:
          shape:
          - 3
          horizon: ${task.low_dim_obs_horizon}
          latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.ft_sensor_obs_latency})
            * ${task.dataset_frequeny}'}
          down_sample_steps: ${task.obs_down_sample_steps}
          type: low_dim
          ignore_by_policy: ${task.ignore_proprioception}
      action:
        shape:
        - 10
        horizon: ${task.action_horizon}
        latency_steps: 0
        down_sample_steps: ${task.obs_down_sample_steps}
        rotation_rep: rotation_6d
    task_name: umi
    dataset_path: GoPro2/dataset.zarr.zip
    pose_repr:
      obs_pose_repr: relative
      action_pose_repr: relative
    env_runner:
      _target_: diffusion_policy.env_runner.real_pusht_image_runner.RealPushTImageRunner
    dataset:
      _target_: diffusion_policy.dataset.umi_dataset_ft_depth.UmiDatasetFTDepth
      shape_meta:
        obs:
          camera0_rgb:
            shape:
            - 3
            - 224
            - 224
            horizon: ${task.img_obs_horizon}
            latency_steps: 0
            down_sample_steps: ${task.obs_down_sample_steps}
            type: rgb
            ignore_by_policy: false
          camera0_depth:
            shape:
            - 3
            - 224
            - 224
            horizon: ${task.img_obs_horizon}
            latency_steps: 0
            down_sample_steps: ${task.obs_down_sample_steps}
            type: depth
            ignore_by_policy: false
          robot0_eef_pos:
            shape:
            - 3
            horizon: ${task.low_dim_obs_horizon}
            latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.robot_obs_latency})
              * ${task.dataset_frequeny}'}
            down_sample_steps: ${task.obs_down_sample_steps}
            type: low_dim
            ignore_by_policy: ${task.ignore_proprioception}
          robot0_eef_rot_axis_angle:
            raw_shape:
            - 3
            shape:
            - 6
            horizon: ${task.low_dim_obs_horizon}
            latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.robot_obs_latency})
              * ${task.dataset_frequeny}'}
            down_sample_steps: ${task.obs_down_sample_steps}
            type: low_dim
            rotation_rep: rotation_6d
            ignore_by_policy: ${task.ignore_proprioception}
          robot0_gripper_width:
            shape:
            - 1
            horizon: ${task.low_dim_obs_horizon}
            latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.gripper_obs_latency})
              * ${task.dataset_frequeny}'}
            down_sample_steps: ${task.obs_down_sample_steps}
            type: low_dim
            ignore_by_policy: ${task.ignore_proprioception}
          robot0_eef_rot_axis_angle_wrt_start:
            raw_shape:
            - 3
            shape:
            - 6
            horizon: ${task.low_dim_obs_horizon}
            latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.robot_obs_latency})
              * ${task.dataset_frequeny}'}
            down_sample_steps: ${task.obs_down_sample_steps}
            type: low_dim
            ignore_by_policy: ${task.ignore_proprioception}
          robot0_force:
            shape:
            - 3
            horizon: ${task.low_dim_obs_horizon}
            latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.ft_sensor_obs_latency})
              * ${task.dataset_frequeny}'}
            down_sample_steps: ${task.obs_down_sample_steps}
            type: low_dim
            ignore_by_policy: ${task.ignore_proprioception}
          robot0_torque:
            shape:
            - 3
            horizon: ${task.low_dim_obs_horizon}
            latency_steps: ${eval:'(${task.camera_obs_latency} - ${task.ft_sensor_obs_latency})
              * ${task.dataset_frequeny}'}
            down_sample_steps: ${task.obs_down_sample_steps}
            type: low_dim
            ignore_by_policy: ${task.ignore_proprioception}
        action:
          shape:
          - 10
          horizon: ${task.action_horizon}
          latency_steps: 0
          down_sample_steps: ${task.obs_down_sample_steps}
          rotation_rep: rotation_6d
      dataset_path: ${task.dataset_path}
      cache_dir: null
      pose_repr:
        obs_pose_repr: relative
        action_pose_repr: relative
      action_padding: false
      temporally_independent_normalization: false
      repeat_frame_prob: 0.0
      max_duration: null
      seed: 42
      val_ratio: 0.05
rt: ${hydra:runtime.choices.agent/features}
exp_name: umi0519
checkpoint_path: ${exp_name}.ckpt
batch_size: 100
num_workers: 10
lr: 0.0003
max_iterations: 500000
eval_freq: 10000
save_freq: 10000
schedule_freq: 1
devices: 1
seed: 292285
buffer_path: /home/soochul/GoPro_20250519_DiT/buf.pkl
normalizer_path: /home/soochul/GoPro_20250519_DiT/normalizer.pkl
ac_chunk: 100
img_chunk: 1
train_transform: medium
wandb:
  name: umi0519_run1
  project: dit_experiments
  group: ${exp_name}
  sweep_name_prefix: eval
  debug: false
  entity: Soochul
